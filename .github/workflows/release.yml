name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: 校验 tag 与 package.json 版本一致
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 版本 $version 不一致" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: 同步包内文档（README / LICENSE）
        run: node scripts/package-docs.mjs
      - name: 校验发布内容
        working-directory: packages/cli
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const required = ['README.md', 'LICENSE', 'bin/memrelay.cjs', 'dist/cli.mjs', 'dsh-plugin/lib/index.js'];
            for (const file of required) {
              if (!fs.existsSync(file)) { console.error('缺少发布文件: ' + file); process.exit(1); }
            }
            for (const key of ['repository', 'homepage', 'bugs']) {
              if (!pkg[key]) { console.error('缺少 package.json 字段: ' + key); process.exit(1); }
            }
            console.log('发布内容检查通过');
          "
      - name: 发布到 npm
        # pnpm 11 不会把 README 写进 registry 元数据，npm 页面会显示空白；这里必须用 npm publish。
        working-directory: packages/cli
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
